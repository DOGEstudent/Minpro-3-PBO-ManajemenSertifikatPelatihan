<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1570" viewBox="0 0 1500 1570"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#405675"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="750.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">Class model, DAO dan JDBC — SDD v0.4</text><rect x="40" y="80" width="320" height="120" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="200.0" y="107" font-size="17" text-anchor="middle">Main / SetupDatabase</text><line x1="40" y1="119" x2="360" y2="119" stroke="#405675"/><text x="54" y="143" font-size="15" text-anchor="start">Main: startup + wiring</text><text x="54" y="166" font-size="15" text-anchor="start">SetupDatabase: seed eksplisit</text><text x="54" y="189" font-size="15" text-anchor="start">Tidak membuat SQL di entry point</text><rect x="430" y="80" width="450" height="120" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="655.0" y="107" font-size="17" text-anchor="middle">SertifikatController</text><line x1="430" y1="119" x2="880" y2="119" stroke="#405675"/><text x="444" y="143" font-size="15" text-anchor="start">-Sesi sesi; menu dan pagination</text><text x="444" y="166" font-size="15" text-anchor="start">Kandidat preview, error/konfirmasi</text><text x="444" y="189" font-size="15" text-anchor="start">+jalankan()</text><rect x="950" y="80" width="500" height="120" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1200.0" y="107" font-size="17" text-anchor="middle">ConsoleView</text><line x1="950" y1="119" x2="1450" y2="119" stroke="#405675"/><text x="964" y="143" font-size="15" text-anchor="start">Scanner/jalur console yang konsisten</text><text x="964" y="166" font-size="15" text-anchor="start">Input/retry; DialogPassword di NetBeans</text><text x="964" y="189" font-size="15" text-anchor="