ction</text><text x="964" y="366" font-size="15" text-anchor="start">Validasi: field, normalisasi, kalender</text><text x="964" y="389" font-size="15" text-anchor="start">Kredensial: PBKDF2 verifikasi</text><text x="964" y="412" font-size="15" text-anchor="start">Tanpa println/password di log</text><polyline points="650,200 650,280" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="430,355 360,355" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="339" font-size="14" text-anchor="start">Sesi</text><polyline points="880,355 950,355" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="874" y="264" font-size="14" text-anchor="start">Connection</text><rect x="40" y="530" width="410" height="180" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="245.0" y="557" font-size="17" text-anchor="middle">DAO master (package model)</text><line x1="40" y1="569" x2="450" y2="569" stroke="#405675"/><text x="54" y="593" font-size="15" text-anchor="start">PenggunaDAO: cari username -&gt; akun</text><text x="54" y="616" font-size="15" text-anchor="start">PesertaDAO: CRUD, email, referensi</text><text x="54" y="639" font-size="15" text-anchor="start">PelatihanDAO: CRUD -&gt; Online / Offline</text><text x="54" y="662" font-size="15" text-anchor="start">semua(Connection): ArrayList&lt;Model&gt;</text><text x="54" y="685" font-size="15" text-anchor="start">PreparedStatement; close statement/resultset</text><rect x="545" y="530" width="410" height="180" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="750.0" y="557" font-size="17" text-anchor="middle">SertifikatDAO</text><line x1="545" y1="569" x2="955" y2="569" stroke="#405675"/><text x="559" y="593" font-size="15" text-anchor="start">CRUD parent + snapshot; detail/riwayat</text><text x="559" y="616" font-size="15" text-anchor="start">cari nama dari snapshot; cek child hilang</text><text x="559" y="639" font-size="15" text-anchor="start">Connection dari caller, tidak commit sendiri</text><text x="559" y="662" font-size="15" text-anchor="start">Affected rows diperiksa model</text><rect x="1060" y="530" width="410" height="180" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1265.0" y="557" font-size="17" text-anchor="middle">NomorDAO / setup</text><line x1="1060" y1="569" x2="1470" y2="569" stroke="#405675"/><text x="1074" y="593" font-size="15" text-anchor="start">NomorDAO: lock/majukan counter</text><text x="1074" y="616" font-size="15" text-anchor="start">SchemaDAO: DDL; SeedDAO: dummy/hash</text><text x="1074" y="639" font-size="15" text-anchor="start">LayananSetup: lock setup + transaksi seed</text><text x="1074" y="662" font-size="15" text-anchor="start">Tidak reset/seed otomatis di Main</text><polyline points="560,440 560,485 245,485 245,530" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="650,440 650,530" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770,440 770,485 1265,485 1265,530" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="40" y="815" width="410" height="150" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="245.0" y="842" font-size="17" text-anchor="middle">Peserta : Ringkasan</text><line x1="40" y1="854" x2="450" y2="854" stroke="#405675"/><text x="54" y="878" font-size="15" text-anchor="start">private final idPeserta; nama/email</text><text x="54" y="901" font-size="15" text-anchor="start">Constructor/setter valid untuk master</text><text x="54" y="924" font-size="15" text-anchor="start">+getRingkasan()</text><text x="54" y="947" font-size="15" text-anchor="start">Objek hasil read bukan penyimpanan utama</text><rect x="545" y="815" width="410" height="170" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="750.0" y="842" font-size="17" text-anchor="middle">Pelatihan &lt;&lt;abstract&gt;&gt; : Ringkasan</text><line x1="545" y1="854" x2="955" y2="854" stroke="#405675"/><text x="559" y="878" font-size="15" text-anchor="start">private final id; nama/durasi/instruktur</text><text x="559" y="901" font-size="15" text-anchor="start">+getDetailPelaksanaan() [abstract]</text><text x="559" y="924" font-size="15" text-anchor="start">+getDetailPelaksanaan(boolean)</text><text x="559" y="947" font-size="15" text-anchor="start">protected getInfoDasar() [concrete]</text><text x="559" y="970" font-size="15" text-anchor="start">+getRingkasan()</text><rect x="1060" y="815" width="410" height="170" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1265.0" y="842" font-size="17" text-anchor="middle">Sertifikat : Ringkasan</text><line x1="1060" y1="854" x2="1470" y2="854" stroke="#405675"/><text x="1074" y="878" font-size="15" text-anchor="start">private final idSertifikat, pencatat</text><text x="1074" y="901" font-size="15" text-anchor="start">peserta, pelatihan, tanggal, snapshot</text><text x="1074" y="924" font-size="15" text-anchor="start">+getRingkasan() [snapshot]</text><text x="1074" y="947" font-size="15" text-anchor="start">Koreksi paket nilai via model/transaction</text><text x="1074" y="970" font-size="15" text-anchor="start">Referensi stabil berdasarkan ID, bukan ==</text><polyline points="245,710 245,815" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="258" y="768" font-size="14" text-anchor="start">ResultSet -&gt; objek</text><polyline points="450,650 490,650 490,780 650,780 650,815" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="505" y="765" font-size="14" text-anchor="start">mapping pelatihan</text><polyline points="850,710 850,750 1265,750 1265,815" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="950" y="738" font-size="14" text-anchor="start">mapping sertifikat + snapshot</text><rect x="40" y="1075" width="410" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="245.0" y="1102" font-size="17" text-anchor="middle">PelatihanOnline</text><line x1="40" y1="1114" x2="450" y2="1114" stroke="#405675"/><text x="54" y="1138" font-size="15" text-anchor="start">platform, tautan; extends Pelatihan</text><text x="54" y="1161" font-size="15" text-anchor="start">override detail; super constructor</text><text x="54" y="1184" font-size="15" text-anchor="start">super.getInfoDasar()</text><rect x="545" y="1075" width="410" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="750.0" y="1102" font-size="17" text-anchor="middle">PelatihanOffline</text><line x1="545" y1="1114" x2="955" y2="1114" stroke="#405675"/><text x="559" y="1138" font-size="15" text-anchor="start">lokasi, ruangan; extends Pelatihan</text><text x="559" y="1161" font-size="15" text-anchor="start">override detail; super constructor</text><text x="559" y="1184" font-size="15" text-anchor="start">super.getInfoDasar()</text><rect x="1060" y="1075" width="410" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1265.0" y="1102" font-size="17" text-anchor="middle">SnapshotSertifikat — immutable</text><line x1="1060" y1="1114" x2="1470" y2="1114" stroke="#405675"/><text x="1074" y="1138" font-size="15" text-anchor="start">Seluruh field salinan private final</text><text x="1074" y="1161" font-size="15" text-anchor="start">1 snapshot versi aktif per Sertifikat</text><text x="1074" y="1184" font-size="15" text-anchor="start">Tidak memanggil ulang master saat tampil</text><polyline points="245,1075 245,1025 610,1025 610,985" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="340" y="1010" font-size="14" text-anchor="start">extends</text><polyline points="750,1075 750,985" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="763" y="1040" font-size="14" text-anchor="start">extends</text><polyline points="1265,985 1265,1075" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1278" y="1040" font-size="14" text-anchor="start">1 : 1</text><rect x="40" y="1300" width="410" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="245.0" y="1327" font-size="17" text-anchor="middle">Ringkasan &lt;&lt;interface&gt;&gt;</text><line x1="40" y1="1339" x2="450" y2="1339" stroke="#405675"/><text x="54" y="1363" font-size="15" text-anchor="start">+getRingkasan(): String</text><text x="54" y="1386" font-size="15" text-anchor="start">Peserta/Pelatihan/Sertifikat implement</text><text x="54" y="1409" font-size="15" text-anchor="start">Helper controller menerima tipe interface</text><rect x="545" y="1300" width="925" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1007.5" y="1327" font-size="17" text-anchor="middle">MySQL — InnoDB + utf8mb4</text><line x1="545" y1="1339" x2="1470" y2="1339" stroke="#405675"/><text x="559" y="1363" font-size="15" text-anchor="start">pengguna | peserta | pelatihan | sertifikat | snapshot_sertifikat | nomor_id</text><text x="559" y="1386" font-size="15" text-anchor="start">SQL hanya DAO; DB sumber utama; transaksi parent/snapshot/counter atomik</text><text x="559" y="1409" font-size="15" text-anchor="start">ArrayList hasil query dipakai alur nyata; data/ID bertahan setelah restart</text><text x="40" y="1480" font-size="16" text-anchor="start">Panah berlabel extends menunjuk induk; garis lain menunjukkan pemakaian/mapping/asosiasi. Diagram merangkum class terkait.</text><text x="40" y="1503" font-size="16" text-anchor="start">Getter/setter rutin disingkat. DAO tidak menutup Connection milik model. FK/UNIQUE/lock merujuk desain database.</text></g></svg>