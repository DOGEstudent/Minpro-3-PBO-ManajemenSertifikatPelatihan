<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#405675"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="700.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">Alur operasional Minpro 3 — rancangan v0.4</text><rect x="440" y="65" width="520" height="65" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="92" font-size="17" text-anchor="middle">Mulai: cek koneksi/schema; seed hanya saat setup</text><rect x="440" y="155" width="520" height="65" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="182" font-size="17" text-anchor="middle">Banner/animasi singkat -&gt; login -&gt; Sesi baru</text><rect x="440" y="245" width="520" height="65" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="272" font-size="17" text-anchor="middle">Menu sesuai role: pilih tindakan</text><polyline points="700,130 700,155" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="700,220 700,245" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="375" width="360" height="100" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="210.0" y="402" font-size="17" text-anchor="middle">Baca / cari / pratinjau</text><line x1="30" y1="414" x2="390" y2="414" stroke="#405675"/><text x="44" y="438" font-size="15" text-anchor="start">Tampilkan data, riwayat peserta, statistik</text><text x="44" y="461" font-size="15" text-anchor="start">Tanpa perubahan data</text><rect x="490" y="375" width="420" height="100" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="402" font-size="17" text-anchor="middle">Tambah / ubah</text><line x1="490" y1="414" x2="910" y2="414" stroke="#405675"/><text x="504" y="438" font-size="15" text-anchor="start">Periksa izin dan ID/master tersedia</text><text x="504" y="461" font-size="15" text-anchor="start">Tolak sebelum formulir bila tidak sah</text><rect x="1000" y="375" width="360" height="100" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1180.0" y="402" font-size="17" text-anchor="middle">Hapus</text><line x1="1000" y1="414" x2="1360" y2="414" stroke="#405675"/><text x="1014" y="438" font-size="15" text-anchor="start">Periksa izin dan keberadaan ID</text><text x="1014" y="461" font-size="15" text-anchor="start">Tampilkan detail dan dampak</text><polyline points="580,310 210,345 210,375" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="250" y="340" font-size="14" text-anchor="start">Baca</text><polyline points="700,310 700,375" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="715" y="345" font-size="14" text-anchor="start">Tambah / ubah</text><polyline points="820,310 1180,345 1180,375" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1070" y="340" font-size="14" text-anchor="start">Hapus</text><rect x="490" y="530" width="420" height="105" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="557" font-size="17" text-anchor="middle">Isi calon perubahan</text><line x1="490" y1="569" x2="910" y2="569" stroke="#405675"/><text x="504" y="593" font-size="15" text-anchor="start">Input invalid: alasan dan ulang field</text><text x="504" y="616" font-size="15" text-anchor="start">/batal: buang calon perubahan</text><polyline points="700,475 700,530" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="685" width="420" height="80" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="700.0" y="712" font-size="17" text-anchor="middle">Sertifikat: pratinjau + y/t</text><polyline points="700,635 700,685" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="715" y="666" font-size="14" text-anchor="start">Sertifikat valid</text><rect x="1000" y="685" width="360" height="80" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1180.0" y="712" font-size="17" text-anchor="middle">Konfirmasi hapus y/t</text><polyline points="1180,475 1180,685" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="825" width="870" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="925.0" y="852" font-size="17" text-anchor="middle">Model + DAO: transaksi, lock dan bandingkan preview</text><line x1="490" y1="864" x2="1360" y2="864" stroke="#405675"/><text x="504" y="888" font-size="15" text-anchor="start">Tambah/ubah: izin, field, unique, referensi, snapshot</text><text x="504" y="911" font-size="15" text-anchor="start">Hapus master: izin, ID dan tidak dirujuk sertifikat</text><text x="504" y="934" font-size="15" text-anchor="start">Commit pasti: sukses. Gagal pasti: rollback. Ambigu: verifikasi DB.</text><polyline points="700,765 700,825" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="714" y="795" font-size="14" text-anchor="start">y</text><polyline points="1180,765 1180,825" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1193" y="795" font-size="14" text-anchor="start">y</text><rect x="30" y="825" width="360" height="130" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="210.0" y="852" font-size="17" text-anchor="middle">Kembali ke menu</text><line x1="30" y1="864" x2="390" y2="864" stroke="#405675"/><text x="44" y="888" font-size="15" text-anchor="start">Selesai baca, gagal, /batal, atau t</text><text x="44" y="911" font-size="15" text-anchor="start">Tampilkan hasil/alasan yang sesuai</text><text x="44" y="934" font-size="15" text-anchor="start">Pesan sukses hanya jika tersimpan</text><polyline points="490,890 390,890" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="210,475 210,825" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="490,730 390,730 210,730 210,825" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="716" font-size="14" text-anchor="start">t</text><polyline points="1360,730 1380,730 1380,985 210,985 210,955" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1320" y="1005" font-size="14" text-anchor="start">t</text><polyline points="30,890 15,890 15,275 440,275" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="28" y="600" font-size="14" text-anchor="start">Ulang menu</text><text x="40" y="1060" font-size="16" text-anchor="start">Logout: cabut sesi, kembali login. Data tersimpan tetap; sesi berikutnya baru.</text><text x="40" y="1083" font-size="16" text-anchor="start">Keluar / EOF: buang formulir, tutup sesi. Restart mempertahankan data/counter MySQL.</text><text x="40" y="1106" font-size="16" text-anchor="start">Input invalid: retry field. /batal: menu utama; t: submenu. Gangguan teknis: aplikasi diakhiri.</text><polyline points="910,580 950,580 950,800 950,825" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="945" y="510" font-size="14" text-anchor="start">Master valid</text></g></svg>