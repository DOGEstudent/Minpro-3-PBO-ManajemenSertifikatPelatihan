<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#405675"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="750.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">ERD Minpro3 — MySQL, SDD v0.4</text><rect x="30" y="85" width="410" height="190" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="235.0" y="112" font-size="17" text-anchor="middle">peserta</text><line x1="30" y1="124" x2="440" y2="124" stroke="#405675"/><text x="44" y="148" font-size="15" text-anchor="start">PK id_peserta VARCHAR(30)</text><text x="44" y="171" font-size="15" text-anchor="start">nama, email</text><text x="44" y="194" font-size="15" text-anchor="start">UNIQUE email_normal (binary lowercase)</text><text x="44" y="217" font-size="15" text-anchor="start">Master: data terkini</text><rect x="545" y="85" width="410" height="190" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="750.0" y="112" font-size="17" text-anchor="middle">pelatihan</text><line x1="545" y1="124" x2="955" y2="124" stroke="#405675"/><text x="559" y="148" font-size="15" text-anchor="start">PK id_pelatihan VARCHAR(30)</text><text x="559" y="171" font-size="15" text-anchor="start">jenis ONLINE / OFFLINE</text><text x="559" y="194" font-size="15" text-anchor="start">nama, durasi, instruktur; field khas</text><text x="559" y="217" font-size="15" text-anchor="start">CHECK durasi dan jenis/field</text><rect x="1060" y="85" width="410" height="190" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1265.0" y="112" font-size="17" text-anchor="middle">pengguna</text><line x1="1060" y1="124" x2="1470" y2="124" stroke="#405675"/><text x="1074" y="148" font-size="15" text-anchor="start">PK id_pengguna VARCHAR(30)</text><text x="1074" y="171" font-size="15" text-anchor="start">UNIQUE username_normal; role</text><text x="1074" y="194" font-size="15" text-anchor="start">salt(16), hash(32), iterasi600000</text><text x="1074" y="217" font-size="15" text-anchor="start">Akun aplikasi; bukan user MySQL</text><rect x="490" y="370" width="520" height="200" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="750.0" y="397" font-size="17" text-anchor="middle">sertifikat</text><line x1="490" y1="409" x2="1010" y2="409" stroke="#405675"/><text x="504" y="433" font-size="15" text-anchor="start">PK id_sertifikat VARCHAR(30)</text><text x="504" y="456" font-size="15" text-anchor="start">FK peserta_id, pelatihan_id, pencatat_id</text><text x="504" y="479" font-size="15" text-anchor="start">tanggal_terbit; semua FK NOT NULL</text><text x="504" y="502" font-size="15" text-anchor="start">UNIQUE(peserta_id, pelatihan_id)</text><text x="504" y="525" font-size="15" text-anchor="start">FK master: ON DELETE RESTRICT</text><polyline points="235,275 235,320 620,320 620,370" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="270" y="305" font-size="14" text-anchor="start">1 peserta : 0..* sertifikat</text><polyline points="750,275 750,370" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="768" y="338" font-size="14" text-anchor="start">1 : 0..*</text><polyline points="1265,275 1265,320 880,320 880,370" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1000" y="305" font-size="14" text-anchor="start">1 pencatat : 0..* sertifikat</text><rect x="80" y="680" width="730" height="175" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="445.0" y="707" font-size="17" text-anchor="middle">snapshot_sertifikat</text><line x1="80" y1="719" x2="810" y2="719" stroke="#405675"/><text x="94" y="743" font-size="15" text-anchor="start">PK/FK sertifikat_id; ON DELETE CASCADE</text><text x="94" y="766" font-size="15" text-anchor="start">nama/email peserta; nama/jenis/durasi/instruktur/detail pelatihan</text><text x="94" y="789" font-size="15" text-anchor="start">Satu snapshot versi aktif; master berubah tidak mengubahnya</text><text x="94" y="812" font-size="15" text-anchor="start">Koreksi parent/snapshot selalu satu transaksi</text><rect x="960" y="680" width="510" height="175" rx="8" fill="#f4f8ff" stroke="#405675" stroke-width="1.5"/><text x="1215.0" y="707" font-size="17" text-anchor="middle">nomor_id</text><line x1="960" y1="719" x2="1470" y2="719" stroke="#405675"/><text x="974" y="743" font-size="15" text-anchor="start">PK jenis: PST / PLT / SRT</text><text x="974" y="766" font-size="15" text-anchor="start">nomor_berikut BIGINT positif</text><text x="974" y="789" font-size="15" text-anchor="start">SELECT FOR UPDATE; transaksi bersama insert</text><text x="974" y="812" font-size="15" text-anchor="start">Tidak punya relasi FK ke entitas</text><polyline points="650,570 650,625 445,625 445,680" fill="none" stroke="#405675" stroke-width="1.7" marker-end="url(#arrow)"/><text x="460" y="610" font-size="14" text-anchor="start">1 sertifikat : 1 snapshot</text><text x="40" y="930" font-size="16" text-anchor="start">Garis berpanah menunjukkan hubungan parent ke child, bukan direction query. Semua tabel InnoDB + utf8mb4.</text><text x="40" y="953" font-size="16" text-anchor="start">Invariant parent wajib punya snapshot dijaga transaksi/read-integrity; FK child saja tidak menjaminnya.</text></g></svg>